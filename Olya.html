<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olya's Calendar 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --bg-main: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
            min-height: 100vh;
        }
        
        /* Modern Soft Package Colors */
        .pkg-1 { background-color: rgba(167, 243, 208, 0.45); transition: all 0.2s; }
        .pkg-2 { background-color: rgba(191, 219, 254, 0.45); transition: all 0.2s; }
        .pkg-3 { background-color: rgba(221, 214, 254, 0.45); transition: all 0.2s; }
        .pkg-4 { background-color: rgba(254, 215, 170, 0.45); transition: all 0.2s; }
        .pkg-5 { background-color: rgba(254, 202, 202, 0.45); transition: all 0.2s; }
        
        /* Lesson Accent Borders & Glows */
        .lesson-border {
            box-shadow: inset 0 0 0 2.5px #2563eb, 0 4px 12px rgba(37, 99, 235, 0.15);
            font-weight: 800;
            transform: scale(1.05);
            z-index: 10;
        }
        .pkg-1.lesson-border { box-shadow: inset 0 0 0 2.5px #059669, 0 4px 12px rgba(5, 150, 105, 0.15); }
        .pkg-2.lesson-border { box-shadow: inset 0 0 0 2.5px #2563eb, 0 4px 12px rgba(37, 99, 235, 0.15); }
        .pkg-3.lesson-border { box-shadow: inset 0 0 0 2.5px #7c3aed, 0 4px 12px rgba(124, 58, 237, 0.15); }
        .pkg-4.lesson-border { box-shadow: inset 0 0 0 2.5px #ea580c, 0 4px 12px rgba(234, 88, 12, 0.15); }
        .pkg-5.lesson-border { box-shadow: inset 0 0 0 2.5px #dc2626, 0 4px 12px rgba(220, 38, 38, 0.15); }

        .day-cell {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-cell:hover {
            transform: scale(1.1);
            z-index: 20;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-12 bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white py-12 px-6 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.15),transparent_50%)]"></div>
            <div class="relative z-10">
                <span class="inline-block px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md text-sm font-semibold tracking-wider mb-3 uppercase border border-white/20">2026</span>
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-2">Olya's Calendar</h1>
            </div>
        </header>

        <main>
            <div id="calendarGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 mb-12"></div>

            <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl border border-slate-200/80 p-8 max-w-5xl mx-auto">
                <h3 class="text-center text-sm font-bold text-slate-400 uppercase tracking-wider mb-6">Legend</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4 justify-items-center">
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg bg-red-50 border border-red-200 flex-shrink-0"></span> Weekend
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg pkg-1 border border-emerald-300 flex-shrink-0"></span> Package 1
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg pkg-2 border border-blue-300 flex-shrink-0"></span> Package 2
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg pkg-3 border border-purple-300 flex-shrink-0"></span> Package 3
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg pkg-4 border border-orange-300 flex-shrink-0"></span> Package 4
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center border border-slate-100">
                        <span class="w-4 h-4 rounded-lg pkg-5 border border-red-300 flex-shrink-0"></span> Package 5
                    </div>
                    <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl w-full justify-center col-span-2 sm:col-span-1 border border-slate-100">
                        <span class="w-4 h-4 rounded-lg bg-white border-2 border-blue-600 flex-shrink-0"></span> Lesson (Wed)
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center text-slate-400 text-sm mt-12 pt-6 border-t border-slate-200/80 font-medium">
            <p>Olya's Calendar 2026 ✨</p>
        </footer>
    </div>

    <script>
        const year = 2026;
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const weekDays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

        function generateWorkingDays(startDateStr, count = 20) {
            let dates = [];
            let curr = new Date(startDateStr);
            while (dates.length < count) {
                let dayOfWeek = curr.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    let y = curr.getFullYear();
                    let m = String(curr.getMonth() + 1).padStart(2, '0');
                    let d = String(curr.getDate()).padStart(2, '0');
                    dates.push(`${y}-${m}-${d}`);
                }
                curr.setDate(curr.getDate() + 1);
            }
            return dates;
        }

        const pkg1 = [
            "2026-01-28","2026-01-29","2026-01-30",
            "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06",
            "2026-02-09","2026-02-10","2026-02-11","2026-02-12","2026-02-13",
            "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
            "2026-02-23","2026-02-24"
        ];

        const pkg2 = [
            "2026-02-25","2026-02-26","2026-02-27",
            "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06",
            "2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13",
            "2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20",
            "2026-03-23","2026-03-24"
        ];

        const pkg3 = [
            "2026-04-08","2026-04-09","2026-04-10",
            "2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17",
            "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
            "2026-04-27","2026-04-28","2026-04-29","2026-04-30",
            "2026-05-04","2026-05-05"
        ];

        const pkg4 = [
            "2026-05-06","2026-05-07","2026-05-08",
            "2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15",
            "2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22",
            "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29",
            "2026-06-01","2026-06-02"
        ];

        const pkg5 = generateWorkingDays("2026-09-02", 20);

        const lessons = [
            "2026-01-28","2026-02-04","2026-02-11","2026-02-18",
            "2026-02-25","2026-03-04","2026-03-11","2026-03-18",
            "2026-04-08","2026-04-15","2026-04-22","2026-04-29",
            "2026-05-06","2026-05-13","2026-05-20","2026-05-27",
            "2026-09-02","2026-09-09","2026-09-16","2026-09-23"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getStartOffset(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getCellClass(dateStr, y, m, d) {
            const in1 = pkg1.includes(dateStr);
            const in2 = pkg2.includes(dateStr);
            const in3 = pkg3.includes(dateStr);
            const in4 = pkg4.includes(dateStr);
            const in5 = pkg5.includes(dateStr);
            const isLesson = lessons.includes(dateStr);
            const isWeekend = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6);

            let cls = "";
            if (in1) cls = "pkg-1";
            else if (in2) cls = "pkg-2";
            else if (in3) cls = "pkg-3";
            else if (in4) cls = "pkg-4";
            else if (in5) cls = "pkg-5";
            else if (isWeekend) cls = "bg-red-50/80 text-red-600 font-medium";

            if (isLesson) {
                cls += " lesson-border";
            }
            return cls;
        }

        function render() {
            const container = document.getElementById("calendarGrid");
            container.innerHTML = "";

            for (let m = 0; m < 12; m++) {
                const daysInMonth = getDaysInMonth(year, m);
                const startOffset = getStartOffset(year, m);
                const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

                let html = `
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border border-slate-200/80 overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="bg-gradient-to-r from-slate-50 to-slate-100 text-slate-800 font-extrabold text-center py-4 text-base border-b border-slate-200/60 tracking-wide uppercase">
                            ${months[m]} ${year}
                        </div>
                        <div class="p-5">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr>
                `;

                for (let w of weekDays) {
                    const isW = (w === "Sat" || w === "Sun");
                    html += `<th class="py-2.5 text-xs font-bold ${isW ? 'text-red-500' : 'text-slate-400'}">${w}</th>`;
                }

                html += `</tr></thead><tbody>`;

                let day = 1;
                for (let i = 0; i < totalCells; i++) {
                    if (i % 7 === 0) html += "<tr>";
                    if (i >= startOffset && day <= daysInMonth) {
                        const dateStr = formatDate(year, m, day);
                        const cls = getCellClass(dateStr, year, m, day);
                        html += `<td><div class="day-cell w-9 h-9 mx-auto my-1 flex items-center justify-center rounded-xl text-sm font-semibold cursor-default ${cls}">${day}</div></td>`;
                        day++;
                    } else {
                        let pm = m === 0 ? 11 : m - 1;
                        let py = m === 0 ? year - 1 : year;
                        let prevDays = getDaysInMonth(py, pm);
                        let prevDay = prevDays - (startOffset - i - 1);
                        html += `<td><div class="w-9 h-9 mx-auto my-1 flex items-center justify-center rounded-xl text-sm text-slate-300 font-medium">${prevDay}</div></td>`;
                    }
                    if (i % 7 === 6) html += "</tr>";
                }
                html += `</tbody></table></div></div>`;
                container.innerHTML += html;
            }
        }

        render();
    </script>
</body>
</html>
